name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck run.sh entrypoint.sh eval/evaluate.sh tests/eval/*.sh tests/eval/fake-kiro-cli
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      # The evaluator validates result.json against a copy of codinferno's
      # schema. The pin makes a hand edit to the copy fail here; updating the
      # schema means updating both repos and the pin together.
      - name: Result schema pin
        run: cd eval/schema && sha256sum -c result.schema.v1.json.sha256
      - name: Evaluator helper unit tests
        run: |
          pip install jsonschema
          python3 -m unittest discover -s tests/eval -p 'test_*.py'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kiro-docker:ci .
      - name: Smoke test - kiro-cli is installed
        run: docker run --rm --entrypoint kiro-cli kiro-docker:ci --version
      - name: Smoke test - missing key is rejected
        run: |
          set +e
          docker run --rm kiro-docker:ci "hello"
          test $? -eq 1
      - name: Evaluate-mode lifecycle (fake kiro-cli)
        run: IMAGE=kiro-docker:ci tests/eval/smoke.sh
